<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admission Form</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14312b;--mute:#5d726d;--line:#d5dcd9;--acc:#1f7a5c;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:Newsreader,Georgia,serif;margin:0}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}
h1{font-size:2rem}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1200px;margin:auto;padding:16px 20px 48px;display:grid;gap:24px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:1.3rem;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.bad{background:transparent;color:var(--bad);padding:4px 8px}
button.sm{background:transparent;color:var(--acc);padding:4px 8px}
.actions{display:flex;gap:10px;margin-top:18px}
.tools{display:flex;gap:10px;margin-bottom:12px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.tag{padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600}
.pending{background:#fdf3d7;color:#7a5a00}.approved{background:#d9f2e6;color:#14603f}.rejected{background:#fbe1de;color:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--mute)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><h1>Admission Form</h1><p>Fill in the student's details and save the application.</p></header>
<main>
<section>
  <h2 id="formTitle">New application</h2>
  <form id="f">
    <label for="full_name">Student name</label><input id="full_name" required minlength="2">
    <label for="father_name">Father's name</label><input id="father_name" required minlength="2">
    <div class="row">
      <div><label for="dob">Date of birth</label><input id="dob" type="date" required></div>
      <div><label for="gender">Gender</label><select id="gender"><option>Male</option><option>Female</option></select></div>
    </div>
    <div class="row">
      <div><label for="phone">Phone</label><input id="phone" type="tel" required pattern="[0-9+\- ]{10,20}" placeholder="03001234567"></div>
      <div><label for="class_applied">Class applying for</label><input id="class_applied" required></div>
    </div>
    <label for="address">Address</label><textarea id="address" rows="3" required minlength="5"></textarea>
    <label for="status">Status</label>
    <select id="status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
    <div class="actions"><button id="saveBtn">Save application</button><button type="button" id="cancel" class="ghost" hidden>Cancel</button></div>
  </form>
</section>
<section>
  <h2>Applications</h2>
  <div class="tools">
    <input id="search" placeholder="Search by name or phone" aria-label="Search">
    <select id="filter" aria-label="Filter by status" style="max-width:150px"><option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>Student</th><th>Father</th><th>Class</th><th>Phone</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="empty" class="empty" hidden>No applications yet. Save the first one using the form.</div>
</section>
</main>
<div id="toast" role="status"></div>
<script>
const API="/api/students",$=id=>document.getElementById(id);
const fields=["full_name","father_name","dob","gender","phone","class_applied","address","status"];
let editId=null,list=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m,err){const t=$("toast");t.textContent=m;t.className="show"+(err?" err":"");setTimeout(()=>t.className="",2500)}
async function api(url,opt){
  const r=await fetch(url,opt);
  if(!r.ok){let m="Something went wrong";try{const d=await r.json();m=typeof d.detail==="string"?d.detail:d.detail.map(e=>e.loc.at(-1)+": "+e.msg).join(", ")}catch{}throw new Error(m)}
  return r.status===204?null:r.json();
}
async function load(){
  const q=new URLSearchParams({search:$("search").value,status:$("filter").value});
  try{list=await api(API+"?"+q)}catch(e){return toast(e.message,1)}
  $("empty").hidden=list.length>0;
  $("rows").innerHTML=list.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${esc(s.father_name)}</td><td>${esc(s.class_applied)}</td><td>${esc(s.phone)}</td>
  <td><span class="tag ${s.status}">${s.status}</span></td>
  <td><button class="sm" data-e="${s.id}">Edit</button><button class="bad" data-d="${s.id}">Delete</button></td></tr>`).join("");
}
function reset(){editId=null;$("f").reset();$("formTitle").textContent="New application";$("saveBtn").textContent="Save application";$("cancel").hidden=true}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const body={};fields.forEach(k=>body[k]=$(k).value.trim());
  try{
    await api(editId?`${API}/${editId}`:API,{method:editId?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    toast(editId?"Application updated":"Application saved");reset();load();
  }catch(err){toast(err.message,1)}
});
$("rows").addEventListener("click",async e=>{
  const eid=e.target.dataset.e,did=e.target.dataset.d;
  if(eid){const s=list.find(x=>x.id==eid);fields.forEach(k=>$(k).value=s[k]);editId=s.id;
    $("formTitle").textContent="Edit application";$("saveBtn").textContent="Update application";$("cancel").hidden=false;$("full_name").focus()}
  if(did&&confirm("Delete this application? This cannot be undone.")){
    try{await api(`${API}/${did}`,{method:"DELETE"});toast("Application deleted");if(editId==did)reset();load()}catch(err){toast(err.message,1)}
  }
});
$("cancel").onclick=reset;
let tm;$("search").oninput=()=>{clearTimeout(tm);tm=setTimeout(load,300)};$("filter").onchange=load;
load();
</script>
</body>
</html>
